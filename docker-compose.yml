services:
  governance-server:
    build:
      context: .
      dockerfile: apps/governance-server/Dockerfile
    environment:
      GOVERNANCE_PORT: "8787"
      LEDGER_PATH: /app/data/decisions.jsonl
    ports:
      - "8787:8787"
    volumes:
      - governance-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  operator-ui:
    build: ./apps/operator-ui
    environment:
      PORT: "5173"
    ports:
      - "5173:5173"
    depends_on:
      governance-server:
        condition: service_healthy

  admin-ui:
    build: ./apps/admin-ui
    environment:
      PORT: "5174"
    ports:
      - "5174:5174"
    depends_on:
      governance-server:
        condition: service_healthy

volumes:
  governance-data:

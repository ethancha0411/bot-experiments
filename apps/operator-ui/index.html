<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator approvals · bot-experiments</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; background:#0c1117; color:#e8edf2; }
    body { max-width: 880px; margin: 0 auto; padding: 3rem 1.25rem; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:2rem; margin-bottom:2rem; }
    h1 { margin:0; font-size:clamp(1.75rem,5vw,3rem); letter-spacing:-.04em; }
    .eyebrow { color:#7ee2b8; font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .muted { color:#91a0af; }
    #status { border:1px solid #253341; border-radius:999px; padding:.35rem .7rem; white-space:nowrap; }
    .card { background:#121a23; border:1px solid #253341; border-radius:14px; padding:1.2rem; margin:1rem 0; box-shadow:0 12px 40px #0004; }
    dl { display:grid; grid-template-columns:110px 1fr; gap:.35rem 1rem; margin:0 0 1rem; }
    dt { color:#91a0af; } dd { margin:0; font-family:ui-monospace,monospace; overflow-wrap:anywhere; }
    button { border:0; border-radius:8px; padding:.65rem 1rem; font-weight:700; cursor:pointer; margin-right:.5rem; }
    .approve { background:#50d6a1; color:#07140f; } .deny { background:#fa6b78; color:#1c0709; }
    button:disabled { opacity:.5; cursor:wait; }
    .empty { padding:2rem; text-align:center; border:1px dashed #344555; border-radius:14px; color:#91a0af; }
    code { color:#b8c7d6; }
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">Owned gate</div><h1>Operator approvals</h1><p class="muted">Human review for tools marked <code>approval_required</code>.</p></div>
    <div id="status">Connecting…</div>
  </header>
  <main id="approvals" aria-live="polite"></main>
  <script>
    const api = window.localStorage.getItem('governanceApi') || 'http://localhost:8787';
    const root = document.querySelector('#approvals');
    const status = document.querySelector('#status');
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

    async function load() {
      try {
        const response = await fetch(`${api}/approvals/pending`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const approvals = await response.json();
        status.textContent = `${approvals.length} pending`;
        root.innerHTML = approvals.length ? approvals.map(approval => `
          <article class="card">
            <dl><dt>Request</dt><dd>${escapeHtml(approval.requestId)}</dd><dt>agentPlugin</dt><dd>${escapeHtml(approval.pluginId)}</dd><dt>Tool</dt><dd>${escapeHtml(approval.tool)}</dd></dl>
            <button class="approve" data-id="${encodeURIComponent(approval.id)}" data-decision="approve">Approve</button>
            <button class="deny" data-id="${encodeURIComponent(approval.id)}" data-decision="deny">Deny</button>
          </article>`).join('') : '<div class="empty">No approvals waiting.</div>';
      } catch (error) {
        status.textContent = 'API offline';
        root.innerHTML = `<div class="empty">Could not reach ${escapeHtml(api)}: ${escapeHtml(error.message)}</div>`;
      }
    }

    root.addEventListener('click', async event => {
      const button = event.target.closest('button[data-decision]');
      if (!button) return;
      root.querySelectorAll('button').forEach(item => item.disabled = true);
      try {
        const response = await fetch(`${api}/approvals/${button.dataset.id}/${button.dataset.decision}`, {
          method: 'POST', headers: {'content-type':'application/json'},
          body: JSON.stringify({actor:'local-operator', reason:`operator_${button.dataset.decision}`})
        });
        if (!response.ok) throw new Error((await response.json()).error || `HTTP ${response.status}`);
      } catch (error) { window.alert(error.message); }
      await load();
    });

    load();
    window.setInterval(load, 3000);
  </script>
</body>
</html>
